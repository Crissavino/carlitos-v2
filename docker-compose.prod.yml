# ==============================================================================
# OpenClaw Production Docker Compose
#
# PERSISTENCE ARCHITECTURE:
#   - Code: Lives in Docker image (/app/), updated on rebuild
#   - State: Lives in Docker volume (openclaw_home), persists across rebuilds
#
# WHAT PERSISTS (in openclaw_home volume):
#   ✅ Chat sessions
#   ✅ Browser pairing (devices/)
#   ✅ Device identity (identity/)
#   ✅ Configuration (openclaw.json)
#   ✅ Audit logs (data/)
#   ✅ Workspace files
#
# SAFE OPERATIONS:
#   ✅ docker compose up -d --build     → Code updates, state preserved
#   ✅ docker compose restart           → State preserved
#   ✅ docker compose down && up -d     → State preserved
#
# DESTRUCTIVE OPERATIONS (will lose state):
#   ⚠️ docker volume rm openclaw_home  → LOSES ALL STATE
#   ⚠️ docker compose down -v          → LOSES ALL STATE
#
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  # ==========================================================================
  # OpenClaw Internal MySQL
  # ==========================================================================
  mysql:
    image: mysql:8.0
    container_name: openclaw-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: openclaw_internal
      MYSQL_USER: openclaw_admin
      MYSQL_PASSWORD: ${DB_OPENCLAW_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./custom-skills/dashboard/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # OpenClaw Core
  # ==========================================================================
  openclaw:
    build: .
    container_name: openclaw
    stdin_open: true
    tty: true
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # ========================================================================
      # SINGLE VOLUME FOR ALL STATE
      # This is the ONLY volume that matters for OpenClaw persistence.
      # Everything in /root/.openclaw/ is preserved across rebuilds.
      # ========================================================================
      - openclaw_home:/root/.openclaw
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Core Database (Avocode - read-only)
      - DB_CORE_HOST=${DB_CORE_HOST}
      - DB_CORE_PORT=${DB_CORE_PORT:-3306}
      - DB_CORE_DATABASE=${DB_CORE_DATABASE:-avocode}
      - DB_CORE_USER=${DB_CORE_USER}
      - DB_CORE_PASSWORD=${DB_CORE_PASSWORD}
      # OpenClaw Internal Database
      - DB_OPENCLAW_HOST=mysql
      - DB_OPENCLAW_PORT=3306
      - DB_OPENCLAW_DATABASE=openclaw_internal
      - DB_OPENCLAW_USER=openclaw_admin
      - DB_OPENCLAW_PASSWORD=${DB_OPENCLAW_PASSWORD}
      # Gateway & Webhooks
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - GOOGLE_ADS_WEBHOOK_TOKEN=${GOOGLE_ADS_WEBHOOK_TOKEN:-}
      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # Dashboard
      - DASHBOARD_PORT=3002
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN}
      # GitHub Access (for git clone/push private repos)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    expose:
      - "18789"
      - "3001"
      - "3002"
    restart: unless-stopped

  # ==========================================================================
  # Caddy (SSL Reverse Proxy)
  # ==========================================================================
  caddy:
    image: caddy:alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - openclaw
    restart: unless-stopped

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  # MySQL data (dashboard DB)
  mysql_data:

  # OpenClaw home directory - ALL STATE LIVES HERE
  # ⚠️ DO NOT DELETE unless you want a factory reset
  openclaw_home:

  # Caddy SSL certificates
  caddy_data:
  caddy_config:
